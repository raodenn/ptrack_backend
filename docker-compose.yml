services:
  redis:
    image: redis:7-alpine
    container_name: ptrack_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: always

  web:
    build: .
    container_name: ptrack_web
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      - redis
    stdin_open: true
    tty: true

  celery_worker:
    build: .
    container_name: ptrack_celery_worker
    command: celery -A ptrack_configuration worker --loglevel=info
    volumes:
      - .:/app
    env_file:
      - .env
    depends_on:
      - redis
    restart: always

  celery_beat:
    build: .
    container_name: ptrack_celery_beat
    command: celery -A ptrack_configuration beat --loglevel=info
    volumes:
      - .:/app
    env_file:
      - .env
    depends_on:
      - redis
    restart: always

volumes:
  redis_data: