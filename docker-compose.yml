version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: ptrack_db

    volumes:
      - postgres_data:/var/lib/postgresql/data
    
    environment:
      - POSTGRES_DB=${DB_NAME}
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
    ports:
      - "5432:5432"
    restart: always

  web:
    build: .
    container_name: ptrack_web

    volumes:
      - .:/app
    
    ports:
      - "8000:8000"
    
    env_file:
      - .env
    
    depends_on:
      - db
    
    stdin_open: true
    tty: true

volumes:
  postgres_data:
